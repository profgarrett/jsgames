# Dreamhost custom configuration for Nginx
#
# Updated Fall 2026
# Changed from apache setup to Nginx setup. The old .htaccess file is no longer used.
# Apache was extremely slow.
#
# Note that this does NOT require that Dreamhost's panel be setup for proxy /api.
# See the location block.
#
# CACHING
# -------
# This file is included inside the server block, so location blocks are valid here.
# Nothing else in the stack sets Cache-Control: nginx serves build/public directly and
# Express only ever sees /api in production. Without explicit headers browsers fall back
# to heuristic caching off Last-Modified, which is unpredictable. The <meta http-equiv>
# cache tags in index.html do NOT work -- modern browsers ignore them for HTTP responses.
#
# Lifetime depends entirely on whether a filename changes when its content changes:
#   - main.<dt>.<chunkhash>.js  -- webpack rewrites the name every build, cache forever.
#   - index.html / meta.json    -- fixed names that point at the hashed bundle. If these
#                                  are ever stale the client loads a dead bundle URL.
#   - /static/*                 -- fixed names, edited by hand between deploys. Medium TTL
#                                  for binaries, short for markdown lesson content.
#
# Two nginx gotchas that shape the blocks below:
#   1. add_header in a child location DISCARDS every add_header inherited from the parent,
#      so each nested block repeats its own.
#   2. Nested locations get their own config, so try_files must be repeated too.


# 1. Hashed webpack bundle (and its sourcemap).
#    Filename carries a build timestamp and a chunkhash, so a given URL can never change
#    content. Safe to cache for a year; `immutable` also stops revalidation on reload.
#    Regex locations are matched before the prefix `location /` below, so this wins.
#    Deliberately no try_files fallback: a missing bundle should 404, not silently
#    return index.html with a 200.
location ~ "^/main\.[0-9]{8}-[0-9]{6}\.[0-9a-f]+\.js(\.map)?$" {
   add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Allow zipping of JavaScript files. This is a bit of a hack: 
    # the gzip module only compresses files with certain MIME types, and webpack's default JS MIME type 
    # is application/javascript, which nginx does not recognize. So we add it here. 
    gzip on;
    gzip_types application/javascript;  # Correct MIME type for JavaScript
    gzip_min_length 0;                  # Forces compression regardless of file size
}


# 2. Entry point and version manifest. Both are fixed names holding a pointer to the
#    current hashed bundle, so they must be revalidated on every request.
#    `no-cache` means "store it, but always revalidate" -- the 304 is cheap and the
#    file is tiny. It does NOT mean "do not store"; that would be no-store.
#    CacheBuster.tsx already appends ?<timestamp> to /meta.json, so this is belt and
#    braces for that one, and load-bearing for index.html.
location = /index.html {
   add_header Cache-Control "no-cache" always;
}
location = /meta.json {
   add_header Cache-Control "no-cache" always;
}


# 3. Static assets. try_files returns a strict 404 if a file is missing rather than
#    falling through to the SPA handler below.
location /static/ {
    try_files $uri =404;

    # Default tier: one day. Covers styles.css and bootstrap.min.css, which are NOT
    # content-hashed -- a longer TTL here means a CSS edit can sit stale in browsers
    # with no way to force a refresh short of renaming the file.
    add_header Cache-Control "public, max-age=86400" always;

    # Markdown lesson content is edited between deploys and is the thing students
    # notice first when stale. Five minutes, and revalidate after that.
    location ~* ^/static/pages/.*\.md$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Binaries: images, fonts, the sql.js wasm blob. This is the bulk of the ~305MB
    # static tree and it changes rarely, so 30 days. If one of these ever does need
    # replacing, change the filename rather than the bytes.
    location ~* ^/static/.*\.(png|jpe?g|gif|svg|webp|ico|woff2?|wasm|pptx)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}


# 4. Anything on the /api path should be proxied to the node server. 
# NOTE: critical to have the trailing slash on /api/ and NOT
#   having it on the proxy_pass. Otherwise, the /api prefix is stripped and the backend sees /sql instead of /api/sql.
#   Also needs to have http prefix on proxy_pass.
location /api/ {
   proxy_http_version 1.1;
   proxy_pass http://127.0.0.1:9000;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

   # Give the backend buffer room to respond during a heavy reload
   # Fixes problem where very fast reloads of the page would cause a 502 error because the backend was not ready to respond.
   proxy_next_upstream error timeout invalid_header http_502;
   proxy_next_upstream_tries 3;

   # Give the backend a 5-second buffer window to recover
   proxy_connect_timeout 5s;
   proxy_read_timeout 60s;
}


# 5. Fallback for React Router navigation for all but /api path.
#    Every unmatched route serves index.html, so the same no-cache rule applies. The
#    internal redirect to /index.html re-enters location matching and would pick up
#    block 2 anyway, but stating it here keeps the intent obvious.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
