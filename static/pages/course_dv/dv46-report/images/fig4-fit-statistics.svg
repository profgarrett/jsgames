<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="270" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222222">Match the statistic to the outcome</text>

  <rect x="30" y="48" width="660" height="30" fill="#0f5fa6"/>
  <text x="44" y="68" font-size="11" font-weight="bold" fill="#ffffff">Your outcome variable</text>
  <text x="264" y="68" font-size="11" font-weight="bold" fill="#ffffff">Model</text>
  <text x="464" y="68" font-size="11" font-weight="bold" fill="#ffffff">Report</text>

  <rect x="30" y="78" width="660" height="40" fill="#f0f6fb" stroke="#dddddd"/>
  <text x="44" y="96" font-size="12" fill="#222222">Continuous</text>
  <text x="44" y="111" font-size="10" fill="#888888">price, revenue, hours</text>
  <text x="264" y="103" font-size="12" fill="#222222">Linear regression (OLS)</text>
  <text x="464" y="96" font-size="12" fill="#222222">R&#178;, RMSE, coefficients</text>
  <text x="464" y="111" font-size="10" fill="#888888">plus a residual plot</text>

  <rect x="30" y="118" width="660" height="40" fill="#ffffff" stroke="#dddddd"/>
  <text x="44" y="136" font-size="12" fill="#222222">Binary</text>
  <text x="44" y="151" font-size="10" fill="#888888">churn, fraud, Santa / parent</text>
  <text x="264" y="143" font-size="12" fill="#222222">Logistic regression</text>
  <text x="464" y="136" font-size="12" fill="#222222">Accuracy, AUC</text>
  <text x="464" y="151" font-size="10" fill="#888888">plus a confusion matrix</text>

  <rect x="30" y="158" width="660" height="40" fill="#ffffff" stroke="#dddddd"/>
  <text x="44" y="176" font-size="12" fill="#222222">Three or more categories</text>
  <text x="44" y="191" font-size="10" fill="#888888">product line, risk tier</text>
  <text x="264" y="183" font-size="12" fill="#222222">Multinomial or tree</text>
  <text x="464" y="176" font-size="12" fill="#222222">Accuracy, F1</text>
  <text x="464" y="191" font-size="10" fill="#888888">plus a confusion matrix</text>

  <text x="30" y="228" font-size="12" fill="#0f5fa6">R&#178; describes variation in a continuous outcome. It does not apply to a 0/1 outcome.</text>
  <text x="30" y="250" font-size="12" fill="#666666">If your outcome is a yes/no field, reporting R&#178; is a sign you fit the wrong model.</text>
</svg>
