<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222222">A caption is an assertion, not a label</text>

  <text x="30" y="52" font-size="10" fill="#999999">LABEL ONLY</text>
  <rect x="30" y="60" width="300" height="130" fill="#fcfcfc" stroke="#e8e8e8"/>
  <rect x="60" y="120" width="28" height="50" fill="#d0d0d0"/>
  <rect x="102" y="105" width="28" height="65" fill="#d0d0d0"/>
  <rect x="144" y="130" width="28" height="40" fill="#d0d0d0"/>
  <rect x="186" y="112" width="28" height="58" fill="#d0d0d0"/>
  <rect x="228" y="136" width="28" height="34" fill="#d0d0d0"/>
  <rect x="270" y="118" width="28" height="52" fill="#d0d0d0"/>
  <line x1="52" y1="170" x2="308" y2="170" stroke="#cccccc"/>
  <text x="30" y="212" font-size="11" font-style="italic" fill="#666666">Figure 3: Sales by month.</text>
  <text x="30" y="232" font-size="10" fill="#999999">Restates the axes. The reader learns nothing.</text>

  <text x="390" y="52" font-size="10" fill="#0f5fa6">STATES THE TAKEAWAY</text>
  <rect x="390" y="60" width="300" height="130" fill="#fcfcfc" stroke="#0f5fa6" stroke-width="2"/>
  <rect x="420" y="120" width="28" height="50" fill="#dddddd"/>
  <rect x="462" y="105" width="28" height="65" fill="#dddddd"/>
  <rect x="504" y="130" width="28" height="40" fill="#0f5fa6"/>
  <rect x="546" y="112" width="28" height="58" fill="#dddddd"/>
  <rect x="588" y="136" width="28" height="34" fill="#0f5fa6"/>
  <rect x="630" y="118" width="28" height="52" fill="#dddddd"/>
  <line x1="412" y1="170" x2="668" y2="170" stroke="#cccccc"/>
  <text x="504" y="96" font-size="9" fill="#0f5fa6">summer dips</text>
  <line x1="518" y1="100" x2="518" y2="126" stroke="#0f5fa6" stroke-width="1"/>
  <line x1="602" y1="100" x2="602" y2="132" stroke="#0f5fa6" stroke-width="1"/>
  <line x1="518" y1="100" x2="602" y2="100" stroke="#0f5fa6" stroke-width="1"/>
  <text x="390" y="212" font-size="11" font-style="italic" fill="#222222">Figure 3. Sales fall in July and September, the</text>
  <text x="390" y="228" font-size="11" font-style="italic" fill="#222222">two months with no promotional campaign.</text>
  <text x="390" y="248" font-size="10" fill="#0f5fa6">Tells the reader where to look and why.</text>

  <line x1="30" y1="266" x2="690" y2="266" stroke="#e8e8e8"/>
  <text x="30" y="288" font-size="12" fill="#666666">Refer to figures by number in your text &#8212; &#8220;Figure 3 shows...&#8221;, never &#8220;the chart below.&#8221;</text>
</svg>
