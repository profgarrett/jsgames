<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="attn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5fa6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f5fa6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="720" height="310" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222222">Put the finding where the attention is</text>

  <text x="20" y="66" font-size="9" fill="#999999" transform="rotate(-90 20 66)" text-anchor="end">reader attention</text>
  <rect x="44" y="62" width="7" height="190" fill="url(#attn)"/>
  <rect x="330" y="62" width="7" height="190" fill="url(#attn)"/>

  <text x="62" y="54" font-size="10" fill="#999999">BURIED</text>
  <rect x="62" y="62" width="240" height="190" fill="#ffffff" stroke="#cccccc"/>
  <rect x="78" y="80" width="150" height="9" fill="#d0d0d0"/>
  <rect x="78" y="102" width="205" height="6" fill="#e8e8e8"/>
  <rect x="78" y="118" width="190" height="6" fill="#e8e8e8"/>
  <rect x="78" y="134" width="200" height="6" fill="#e8e8e8"/>
  <rect x="78" y="150" width="175" height="6" fill="#e8e8e8"/>
  <rect x="78" y="166" width="198" height="6" fill="#e8e8e8"/>
  <rect x="78" y="182" width="185" height="6" fill="#e8e8e8"/>
  <rect x="78" y="204" width="150" height="10" fill="#0f5fa6"/>
  <rect x="78" y="228" width="160" height="6" fill="#e8e8e8"/>
  <text x="236" y="213" font-size="9" fill="#0f5fa6">finding</text>

  <text x="348" y="54" font-size="10" fill="#0f5fa6">FINDING FIRST</text>
  <rect x="348" y="62" width="240" height="190" fill="#ffffff" stroke="#0f5fa6" stroke-width="2"/>
  <rect x="364" y="80" width="150" height="9" fill="#d0d0d0"/>
  <rect x="364" y="102" width="150" height="10" fill="#0f5fa6"/>
  <text x="522" y="111" font-size="9" fill="#0f5fa6">finding</text>
  <rect x="364" y="126" width="205" height="6" fill="#e8e8e8"/>
  <rect x="364" y="142" width="190" height="6" fill="#e8e8e8"/>
  <rect x="364" y="158" width="200" height="6" fill="#e8e8e8"/>
  <rect x="364" y="174" width="175" height="6" fill="#e8e8e8"/>
  <rect x="364" y="190" width="198" height="6" fill="#e8e8e8"/>
  <rect x="364" y="206" width="185" height="6" fill="#e8e8e8"/>
  <rect x="364" y="222" width="160" height="6" fill="#e8e8e8"/>

  <text x="62" y="276" font-size="11" fill="#666666">The reader has to earn the answer.</text>
  <text x="348" y="276" font-size="11" fill="#666666">The rest of the report lets them check it.</text>
  <text x="62" y="298" font-size="12" fill="#666666">Readers skim. Assume the first paragraph is all anyone reads, and write it that way.</text>
</svg>
