<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Seven sections, seven questions</text>
  <text x="20" y="48" font-size="12" fill="#666666">Each section answers the question your reader is about to ask.</text>

  <rect x="40" y="66" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="82" r="10" fill="#999999"/>
  <text x="58" y="86" font-size="11" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="86" font-size="12" fill="#222222">Title &amp; Introduction</text>
  <text x="270" y="86" font-size="11" fill="#666666">What did you find, and why does it matter?</text>

  <rect x="40" y="104" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="120" r="10" fill="#999999"/>
  <text x="58" y="124" font-size="11" fill="#ffffff" text-anchor="middle">2</text>
  <text x="78" y="124" font-size="12" fill="#222222">Data</text>
  <text x="270" y="124" font-size="11" fill="#666666">Where did the numbers come from?</text>

  <rect x="40" y="142" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="158" r="10" fill="#999999"/>
  <text x="58" y="162" font-size="11" fill="#ffffff" text-anchor="middle">3</text>
  <text x="78" y="162" font-size="12" fill="#222222">Methods</text>
  <text x="270" y="162" font-size="11" fill="#666666">What did you do to them, and why that?</text>

  <rect x="40" y="180" width="210" height="32" fill="#f0f6fb" stroke="#0f5fa6" stroke-width="2"/>
  <circle cx="58" cy="196" r="10" fill="#0f5fa6"/>
  <text x="58" y="200" font-size="11" fill="#ffffff" text-anchor="middle">4</text>
  <text x="78" y="200" font-size="12" font-weight="bold" fill="#0f5fa6">Results</text>
  <text x="270" y="200" font-size="11" fill="#0f5fa6">What did the analysis actually show?</text>

  <rect x="40" y="218" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="234" r="10" fill="#999999"/>
  <text x="58" y="238" font-size="11" fill="#ffffff" text-anchor="middle">5</text>
  <text x="78" y="238" font-size="12" fill="#222222">Limitations</text>
  <text x="270" y="238" font-size="11" fill="#666666">What could be wrong with this?</text>

  <rect x="40" y="256" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="272" r="10" fill="#999999"/>
  <text x="58" y="276" font-size="11" fill="#ffffff" text-anchor="middle">6</text>
  <text x="78" y="276" font-size="12" fill="#222222">Recommendation</text>
  <text x="270" y="276" font-size="11" fill="#666666">So what should be done about it?</text>

  <rect x="40" y="294" width="210" height="32" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="58" cy="310" r="10" fill="#999999"/>
  <text x="58" y="314" font-size="11" fill="#ffffff" text-anchor="middle">7</text>
  <text x="78" y="314" font-size="12" fill="#222222">References</text>
  <text x="270" y="314" font-size="11" fill="#666666">Where can I go check any of this?</text>
</svg>
