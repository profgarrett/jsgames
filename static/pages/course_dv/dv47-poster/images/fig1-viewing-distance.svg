  <text x="190" y="92" font-size="9" fill="#ffffff" text-anchor="middle">SANTA'S GIFTS COST THE SAME AS OURS</text>
  <rect x="48" y="110" width="284" height="22" fill="#dce9f5" stroke="#0f5fa6" stroke-width="0.8"/>
  <text x="190" y="125" font-size="7.5" fill="#0f5fa6" text-anchor="middle">A $0.42 difference on a $34 gift. Santa is us.</text>

