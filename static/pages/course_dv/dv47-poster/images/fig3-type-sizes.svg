<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="372" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Type sizes on a 48&#215;36 in poster</text>
  <text x="20" y="48" font-size="12" fill="#666666">Bar length is the point size. Set the canvas to true size and these are literal.</text>

  <rect x="200" y="62" width="96" height="248" fill="#f7f7f7"/>
  <line x1="296" y1="62" x2="296" y2="302" stroke="#0f5fa6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="304" y="314" font-size="10" fill="#0f5fa6">24 pt floor for body text</text>

  <text x="190" y="88" font-size="12" fill="#222222" text-anchor="end">Title</text>
  <rect x="200" y="76" width="400" height="18" fill="#0f5fa6"/>
  <text x="612" y="89" font-size="10" fill="#888888">100 pt &#183; 15&#8211;20 ft</text>

  <text x="190" y="128" font-size="12" fill="#222222" text-anchor="end">Headline finding</text>
  <rect x="200" y="116" width="240" height="18" fill="#0f5fa6"/>
  <text x="452" y="129" font-size="10" fill="#888888">60 pt &#183; 10 ft</text>

  <text x="190" y="168" font-size="12" fill="#222222" text-anchor="end">Section heading</text>
  <rect x="200" y="156" width="192" height="18" fill="#0f5fa6"/>
  <text x="404" y="169" font-size="10" fill="#888888">48 pt &#183; 6 ft</text>

  <text x="190" y="208" font-size="12" fill="#222222" text-anchor="end">Body text</text>
  <rect x="200" y="196" width="112" height="18" fill="#0f5fa6"/>
  <text x="324" y="209" font-size="10" fill="#888888">28 pt &#183; 4 ft</text>

  <text x="190" y="248" font-size="12" fill="#666666" text-anchor="end">Figure captions</text>
  <rect x="200" y="236" width="88" height="18" fill="#bbbbbb"/>
  <text x="304" y="249" font-size="10" fill="#888888">22 pt &#183; 3 ft</text>

  <text x="190" y="288" font-size="12" fill="#666666" text-anchor="end">References</text>
  <rect x="200" y="276" width="72" height="18" fill="#bbbbbb"/>
  <text x="304" y="289" font-size="10" fill="#888888">18 pt &#183; up close</text>

  <text x="20" y="340" font-size="12" fill="#666666">Body text never crosses the line. Captions and references may.</text>
  <text x="20" y="358" font-size="12" fill="#666666">If your content will not fit at 24 pt, the problem is the amount of content.</text>
</svg>
