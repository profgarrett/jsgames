<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="356" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Set the canvas before you build the poster</text>

  <rect x="30" y="60" width="280" height="200" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="30" y="60" width="280" height="26" fill="#eeeeee" stroke="#bbbbbb"/>
  <text x="42" y="78" font-size="11" font-weight="bold" fill="#444444">Custom Slide Size</text>

  <text x="46" y="115" font-size="11" fill="#444444">Width:</text>
  <rect x="120" y="101" width="90" height="22" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <text x="132" y="116" font-size="11" font-weight="bold" fill="#0f5fa6">48 in</text>

  <text x="46" y="150" font-size="11" fill="#444444">Height:</text>
  <rect x="120" y="136" width="90" height="22" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <text x="132" y="151" font-size="11" font-weight="bold" fill="#0f5fa6">36 in</text>

  <text x="46" y="185" font-size="11" fill="#444444">Orientation:</text>
  <circle cx="128" cy="181" r="5" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <circle cx="128" cy="181" r="2.5" fill="#0f5fa6"/>
  <text x="140" y="185" font-size="11" fill="#222222">Landscape</text>
  <circle cx="212" cy="181" r="5" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="224" y="185" font-size="11" fill="#999999">Portrait</text>

  <rect x="212" y="216" width="80" height="26" fill="#0f5fa6"/>
  <text x="252" y="233" font-size="11" fill="#ffffff" text-anchor="middle">OK</text>
  <text x="46" y="233" font-size="9" fill="#999999">Max is 56 in per side</text>

  <text x="360" y="54" font-size="10" fill="#0f5fa6">margin and column guides</text>
  <rect x="360" y="60" width="320" height="240" fill="#fcfcfc" stroke="#999999"/>
  <rect x="374" y="74" width="292" height="212" fill="none" stroke="#0f5fa6" stroke-dasharray="4 3"/>
  <line x1="471" y1="74" x2="471" y2="286" stroke="#0f5fa6" stroke-dasharray="4 3"/>
  <line x1="569" y1="74" x2="569" y2="286" stroke="#0f5fa6" stroke-dasharray="4 3"/>
  <text x="666" y="70" font-size="9" fill="#0f5fa6" text-anchor="end">1.5 in margin</text>
  <text x="520" y="316" font-size="9" fill="#0f5fa6" text-anchor="middle">three equal columns</text>

  <text x="30" y="342" font-size="12" fill="#666666">Resizing a finished poster rescales and distorts everything already on it. Do this step first.</text>
</svg>
