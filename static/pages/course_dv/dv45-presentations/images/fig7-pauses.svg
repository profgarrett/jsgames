<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 265" width="720" height="265" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="265" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Pauses do the work</text>

  <text x="24" y="82" font-size="11" fill="#999999">RUSHED</text>
  <rect x="110" y="64" width="560" height="26" fill="#e4e4e4"/>
  <text x="390" y="81" font-size="10" fill="#888888" text-anchor="middle">one continuous stream, no gaps, filler words in place of silence</text>

  <text x="24" y="152" font-size="11" font-weight="bold" fill="#0f5fa6">PACED</text>
  <rect x="110" y="134" width="90" height="26" fill="#dce9f5"/>
  <rect x="214" y="134" width="70" height="26" fill="#dce9f5"/>
  <rect x="298" y="134" width="120" height="26" fill="#dce9f5"/>
  <rect x="440" y="134" width="60" height="26" fill="#0f5fa6"/>
  <text x="470" y="151" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">20%</text>
  <rect x="516" y="134" width="154" height="26" fill="#dce9f5"/>

  <line x1="418" y1="128" x2="440" y2="128" stroke="#0f5fa6" stroke-width="1.5"/>
  <line x1="418" y1="124" x2="418" y2="132" stroke="#0f5fa6" stroke-width="1.5"/>
  <line x1="440" y1="124" x2="440" y2="132" stroke="#0f5fa6" stroke-width="1.5"/>
  <text x="429" y="116" font-size="10" fill="#0f5fa6" text-anchor="middle">pause before the number, not after</text>

  <text x="110" y="182" font-size="9" fill="#999999">gaps between segments are pauses</text>

  <text x="24" y="218" font-size="12" fill="#666666">A two-second pause feels enormous to you and brief to the audience.</text>
  <text x="24" y="240" font-size="12" fill="#666666">Rate and monotony are different problems: pausing fixes rate, emphasis fixes monotony.</text>
</svg>
