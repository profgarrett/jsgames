<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Time budget for a 10-minute talk</text>

  <rect x="60" y="56" width="60" height="44" fill="#eeeeee" stroke="#cccccc"/>
  <text x="90" y="76" font-size="10" fill="#666666" text-anchor="middle">Opening</text>
  <text x="90" y="90" font-size="10" fill="#999999" text-anchor="middle">1 min</text>

  <rect x="120" y="56" width="420" height="44" fill="#f0f6fb" stroke="#0f5fa6"/>
  <text x="330" y="76" font-size="13" font-weight="bold" fill="#0f5fa6" text-anchor="middle">Body</text>
  <text x="330" y="92" font-size="10" fill="#0f5fa6" text-anchor="middle">7 min</text>

  <rect x="540" y="56" width="120" height="44" fill="#eeeeee" stroke="#cccccc"/>
  <text x="600" y="76" font-size="10" fill="#666666" text-anchor="middle">Close + Q&amp;A</text>
  <text x="600" y="90" font-size="10" fill="#999999" text-anchor="middle">2 min</text>

  <polygon points="120,100 540,100 660,150 60,150" fill="#f5f9fc"/>

  <rect x="60" y="150" width="112" height="58" fill="#f7f7f7" stroke="#dddddd"/>
  <text x="116" y="172" font-size="10" fill="#999999" text-anchor="middle">1</text>
  <text x="116" y="190" font-size="12" fill="#444444" text-anchor="middle">Question</text>

  <rect x="182" y="150" width="112" height="58" fill="#f7f7f7" stroke="#dddddd"/>
  <text x="238" y="172" font-size="10" fill="#999999" text-anchor="middle">2</text>
  <text x="238" y="190" font-size="12" fill="#444444" text-anchor="middle">Data</text>

  <rect x="304" y="150" width="112" height="58" fill="#f0f6fb" stroke="#0f5fa6" stroke-width="2"/>
  <text x="360" y="172" font-size="10" fill="#0f5fa6" text-anchor="middle">3</text>
  <text x="360" y="190" font-size="12" font-weight="bold" fill="#0f5fa6" text-anchor="middle">Finding</text>

  <rect x="426" y="150" width="112" height="58" fill="#f7f7f7" stroke="#dddddd"/>
  <text x="482" y="172" font-size="10" fill="#999999" text-anchor="middle">4</text>
  <text x="482" y="190" font-size="12" fill="#444444" text-anchor="middle">Limits</text>

  <rect x="548" y="150" width="112" height="58" fill="#f7f7f7" stroke="#dddddd"/>
  <text x="604" y="172" font-size="10" fill="#999999" text-anchor="middle">5</text>
  <text x="604" y="190" font-size="12" fill="#444444" text-anchor="middle">Action</text>

  <text x="60" y="238" font-size="12" fill="#666666">One claim per section, one chart per claim.</text>
  <text x="60" y="258" font-size="12" fill="#666666">Organize around claims &#8212; not around the order in which you did the work.</text>
</svg>
