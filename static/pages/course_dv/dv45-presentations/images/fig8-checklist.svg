<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="290" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">Before you present</text>

  <rect x="30" y="56" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M34,64 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="60" y="70" font-size="13" fill="#222222">Rehearse out loud, standing, twice</text>

  <rect x="30" y="102" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M34,110 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="60" y="116" font-size="13" fill="#222222">Time it &#8212; going long is the worst error</text>

  <rect x="30" y="148" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M34,156 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="60" y="162" font-size="13" fill="#222222">Save versioned files (v1, v2, final)</text>

  <rect x="30" y="194" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M34,202 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="60" y="208" font-size="13" fill="#222222">Export a PDF backup</text>

  <rect x="390" y="56" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M394,64 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="420" y="70" font-size="13" fill="#222222">Email the file to yourself</text>

  <rect x="390" y="102" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M394,110 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="420" y="116" font-size="13" fill="#222222">Test colors on their projector</text>

  <rect x="390" y="148" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M394,156 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="420" y="162" font-size="13" fill="#222222">Walk to the back row and read</text>

  <rect x="390" y="194" width="18" height="18" rx="3" fill="#ffffff" stroke="#0f5fa6" stroke-width="1.5"/>
  <path d="M394,202 l3.5,4 l7,-9" fill="none" stroke="#0f5fa6" stroke-width="2"/>
  <text x="420" y="208" font-size="13" fill="#222222">Know how to advance without a clicker</text>

  <line x1="30" y1="238" x2="690" y2="238" stroke="#e8e8e8"/>
  <text x="30" y="264" font-size="12" fill="#666666">PDFs open everywhere. Your fonts and animations may not.</text>
</svg>
