<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="792" viewBox="0 0 880 396" role="img" aria-labelledby="vfT vfD">
<title id="vfT">Resolution across the visual field, and how acuity falls off with eccentricity</title>
<desc id="vfD">Left: a simulated visual field. Letters near the fixation cross are sharp; letters farther out are progressively blurred, and the blind spot is marked about fifteen degrees to one side. Right: a curve of relative acuity against degrees from the center of gaze. It peaks sharply at zero degrees, falls below twenty percent of peak by ten degrees, and drops to zero across the blind spot before resuming at a low level.</desc>

<style>
  .ttl  { font: 600 13px var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif); fill: var(--text-primary, #191919); }
  .sm   { font: 400 10.5px var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif); fill: var(--text-muted, #7d7d7d); }
  .acc  { font: 600 11.5px var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif); fill: var(--text-accent, #b8562f); }
  .gly  { font: 500 19px var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif); fill: var(--text-primary, #191919); }
  .ink  { fill: none; stroke: var(--text-primary, #191919); stroke-width: 1.5; }
  .soft { fill: none; stroke: var(--border-strong, #c9c9c9); stroke-width: 1; }
  .hair { fill: none; stroke: var(--border, #e2e2e2); stroke-width: 1; }
  .as   { fill: none; stroke: var(--text-accent, #b8562f); stroke-width: 1.5; }
</style>

<defs>
  <filter id="g0" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.5"/></filter>
  <filter id="g1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="g2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="g3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  <filter id="g4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.4"/></filter>
  <filter id="g5" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6.2"/></filter>
  <clipPath id="vfClip"><rect x="16" y="52" width="430" height="290" rx="3"/></clipPath>
</defs>

<text class="ttl" x="16" y="26">What you actually see</text>
<rect x="16" y="52" width="430" height="290" rx="3" fill="var(--surface-1, #f7f7f5)" stroke="var(--border-strong, #c9c9c9)" stroke-width="1"/>

<g clip-path="url(#vfClip)">
  <circle cx="196" cy="192" r="50"  class="hair" stroke-dasharray="3 4"/>
  <circle cx="196" cy="192" r="100" class="hair" stroke-dasharray="3 4"/>
  <circle cx="196" cy="192" r="150" class="hair" stroke-dasharray="3 4"/>
  <circle cx="196" cy="192" r="10"  class="as" stroke-width="1"/>

  <text class="gly" x="186" y="170" filter="url(#g0)">R</text>
  <text class="gly" x="220" y="216" filter="url(#g1)">E</text>
  <text class="gly" x="160" y="152" filter="url(#g1)">T</text>
  <text class="gly" x="106" y="226" filter="url(#g2)">A</text>
  <text class="gly" x="266" y="100" filter="url(#g3)">S</text>
  <text class="gly" x="144" y="296" filter="url(#g3)">N</text>
  <text class="gly" x="234" y="312" filter="url(#g4)">H</text>
  <text class="gly" x="66"  y="126" filter="url(#g4)">K</text>
  <text class="gly" x="358" y="142" filter="url(#g4)">D</text>
  <text class="gly" x="54"  y="292" filter="url(#g4)">P</text>
  <text class="gly" x="402" y="236" filter="url(#g5)">M</text>
  <text class="gly" x="330" y="322" filter="url(#g5)">G</text>

  <ellipse cx="271" cy="202" rx="13" ry="18" fill="var(--text-accent, #b8562f)" opacity="0.14"/>
  <ellipse cx="271" cy="202" rx="13" ry="18" class="as" stroke-dasharray="3 3"/>
</g>

<path d="M196,184 L196,200 M188,192 L204,192" class="as" stroke-width="2"/>
<path d="M206,185 L232,154" class="hair"/>
<text class="acc" x="236" y="151">≈2° sharp</text>
<path d="M283,210 L314,266" class="hair"/>
<text class="acc" x="318" y="270">blind spot</text>
<text class="sm"  x="318" y="284">≈15° off center</text>

<text class="sm" x="16" y="362">Fixate on the +. Only the central ~2° resolves detail;</text>
<text class="sm" x="16" y="376">everything outside it arrives at lower resolution.</text>

<path d="M470,40 L470,384" class="hair"/>

<text class="ttl" x="484" y="26">Acuity falls off fast</text>

<rect x="631.4" y="120" width="41.2" height="200" fill="var(--text-accent, #b8562f)" opacity="0.10"/>
<path d="M520,120 L524.1,155.8 L528.3,180.6 L536.5,213 L544.8,233.2 L561.3,257 L586,275.4 L610.8,285.4 L627.3,290 L631.4,320 L672.6,320 L672.6,297.8 L718,302.6 L767.5,305.8 L850,309.2 L850,320 L520,320 Z"
      fill="var(--text-primary, #191919)" opacity="0.10"/>
<path d="M520,120 L524.1,155.8 L528.3,180.6 L536.5,213 L544.8,233.2 L561.3,257 L586,275.4 L610.8,285.4 L627.3,290 L631.4,320 L672.6,320 L672.6,297.8 L718,302.6 L767.5,305.8 L850,309.2"
      class="ink" stroke-width="2" stroke-linejoin="round"/>

<path d="M520,110 L520,320 L856,320" class="soft"/>
<path d="M520,320 L520,325 M602.5,320 L602.5,325 M685,320 L685,325 M767.5,320 L767.5,325 M850,320 L850,325" class="soft"/>
<text class="sm" x="520"   y="338" text-anchor="middle">0°</text>
<text class="sm" x="602.5" y="338" text-anchor="middle">10°</text>
<text class="sm" x="685"   y="338" text-anchor="middle">20°</text>
<text class="sm" x="767.5" y="338" text-anchor="middle">30°</text>
<text class="sm" x="850"   y="338" text-anchor="middle">40°</text>
<text class="sm" x="514" y="124" text-anchor="end">100%</text>
<text class="sm" x="514" y="224" text-anchor="end">50%</text>
<text class="sm" x="514" y="324" text-anchor="end">0</text>

<path d="M523,122 L556,112" class="hair"/>
<text class="acc" x="560" y="116">fovea</text>
<text class="acc" x="652" y="108" text-anchor="middle">blind spot</text>

<text class="sm" x="484" y="362">Schematic: relative acuity vs. degrees from the center of gaze.</text>
<text class="sm" x="484" y="376">By 10° off center, acuity is under 20% of peak.</text>
</svg>
