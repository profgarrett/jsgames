<style>

  }

  .reveal .slides section { text-align: left; padding-top: 1.2em; }

  /* Presentation-wide override: when toggled on (see the "Scroll" control),

  /* Use markdown title as caption for the image */

  /* Images that stand alone on their own Markdown line get tagged

     that class on the wrapping <p>, not the <img> itself -- text-align

  .reveal .slides section p.centered-image { text-align: center; }
  .reveal .slides section p.centered-image img { display: block; margin: 0 auto; }

  /* Runtime text-size + canvas-size controls: let the presenter bump slide
     text up/down and change Reveal's nominal design resolution to fit the
     room (projector vs. laptop). The canvas-size control changes the same

<script type="module">
  import Reveal from 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.esm.js';
  import Markdown from 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.esm.js';
  import Highlight from 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.esm.js';
  import Notes from 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.esm.js';

  // Rewrite relative image/link targets in the fetched Markdown so that they
  // resolve against /static/pages/{course}/{module}/... instead of against
  // this page's own URL (which is where the browser would otherwise look).
  function rewriteRelativePaths(markdown, course, mod) {
    const base = `/static/pages/${course}/${mod}`;
    return markdown.replace(/(!?\[[^\]]*\]\()([^)\s]+)(\s*(?:"[^"]*")?\))/g, (match, prefix, target, suffix) => {
      if (/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(target)) return match;
      return `${prefix}${base}/${target}${suffix}`;
    });
  }

  // A Markdown line containing nothing but a single image (no surrounding
  // text) is tagged with a `.element:` directive so reveal.js's markdown
  // plugin adds a "centered-image" class to just that image -- an image
  // sharing a line or paragraph with other text is left to flow naturally
  // instead. Like the `.slide:` directive above, this only works when the
  // comment sits on the line immediately after the element it targets.
  function centerStandaloneImages(markdown) {
    return markdown.replace(
      /^[ \t]*(!\[[^\]]*\]\([^)]+\))[ \t]*$/gm,
      '$1\n<!-- .element: class="centered-image" -->'
    );
  }

  // Question and review slides tend to run long; mark them scrollable so reveal.js lets
  // the user scroll instead of clipping the extra content. reveal.js applies a
  // class to the <section> only via a `<!-- .slide: class="..." -->` directive
  // on its own line -- the Pandoc-style `{class="..."}` suffix used by other
  // Markdown tools has no meaning here and just renders as literal text.
  function markQuestionSlidesScrollable(markdown) {
    let m = markdown.replace(/^(## Question.*)$/gm, '$1\n<!-- .slide: class="scrollable-slide" -->');
    m = m.replace(/^(## Review.*)$/gm, '$1\n<!-- .slide: class="scrollable-slide" -->');
    return m;
  }

  // A YouTube link on its own line (used to give a video its own slide) is
  // replaced with a clickable thumbnail, followed by a vertical slide (reached
  // by pressing "down") holding the actual embed. `data-autoplay` is
  // reveal.js's own convention for starting playback as soon as that vertical
  // slide becomes active.
  function addAutoplayToYoutubeEmbeds(markdown) {
    const idFromUrl = (url) => {
      const match = url.match(/(?:[?&]v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
      return match ? match[1] : null;
    };

    return markdown.replace(
      /^\s*(?:\[[^\]]*\]\()?(https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/[^\s)]+)\)?\s*$/gm,
      (match, url) => {
        const id = idFromUrl(url);
        if (!id) return match;
        const thumbnail = `[![Click to play video](https://img.youtube.com/vi/${id}/hqdefault.jpg)](${url})`;
        const embed = `<iframe data-autoplay src="https://www.youtube.com/embed/${id}" width="960" height="540" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        return `${thumbnail}\n\n--\n\n${embed}`;
      }
    );
  }

  // Set the page's <title> from the fetched Markdown: the first `#` (h1)
  // heading is the module title, and, when the first `###` (h3) heading
  // follows the "code — subtitle" convention used across slides.md files
  // (e.g. "### dv20 — Data Values and Structure"), its leading code is
  // prefixed onto the title (e.g. "dv20 — Understanding Your Data").
  function setTitleFromMarkdown(markdown) {
    const h1Match = markdown.match(/^#\s+(.+)$/m);
    if (!h1Match) return;
    const h1 = h1Match[1].trim();

    const h3Match = markdown.match(/^###\s+(.+)$/m);
    let code = null;
    if (h3Match) {
      const parts = h3Match[1].split(/\s+—\s+/);
      if (parts.length > 1) code = parts[0].trim();
    }

    document.title = code ? `${code} — ${h1}` : h1;
  }

  // Load slides from /static/pages/{course}/{module}/slides.md when
  // ?course=...&module=... is present; otherwise keep the sample markdown.
  async function loadSlidesFromQuery() {
    const params = new URLSearchParams(window.location.search);
    const course = params.get('course');
    const mod = params.get('module');
    if (!course || !mod) return;

    const path = `${course}/${mod}/slides.md`;
    try {
      const response = await fetch(path);
      if (!response.ok) {
        console.warn(`slides.html: could not load "${path}" (${response.status}); showing sample slides.`);
        return;
      }
      const markdown = await response.text();
      setTitleFromMarkdown(markdown);
      const textarea = document.querySelector('.reveal .slides textarea[data-template]');
      textarea.textContent = addAutoplayToYoutubeEmbeds(markQuestionSlidesScrollable(centerStandaloneImages(rewriteRelativePaths(markdown, course, mod))));
    } catch (err) {
      console.warn(`slides.html: error loading "${path}"; showing sample slides.`, err);
    }
  }

  await loadSlidesFromQuery();

  Reveal.initialize({
    hash: true,
    center: false,
    slideNumber: 'c/t',
    controls: true,
    progress: true,
    transition: 'slide',
    width: 1920,
    height: 1080,
    margin: 0.06,
    minScale: 0.5,
    plugins: [Markdown, Highlight, Notes]
  }).then(() => {
    // Automatically turn Markdown image text into captions
    document.querySelectorAll('.reveal img[alt]').forEach(img => {
      // Skip if the image description is empty
      if (!img.getAttribute('alt').trim()) return;

      // Create a container wrapper
      const figure = document.createElement('figure');
      figure.className = 'image-caption-container';
      
      // Create the caption element using the markdown description
      const caption = document.createElement('figcaption');
      caption.textContent = img.getAttribute('alt');
      caption.className = 'image-markdown-caption';

      // Swap the elements in the DOM
      img.parentNode.insertBefore(figure, img);
      figure.appendChild(img);
      figure.appendChild(caption);
    });

    // --- Runtime text-size control -------------------------------------
    // Reveal's own width/height scaling only reacts to pixel resolution,
    // not the physical size of the room, so give presenters a manual
    // override: buttons + keyboard shortcuts that scale a CSS variable on
    // top of Reveal's transform. Persisted per browser via localStorage.
    (function initZoomControls() {
      const STORAGE_KEY = 'dv-slides-zoom-scale';
      const MIN_ZOOM = 0.7;
      const MAX_ZOOM = 1.6;
      const STEP = 0.1;

      const root = document.documentElement;
      const levelEl = document.getElementById('zoom-level');

      function readStored() {
        const raw = parseFloat(localStorage.getItem(STORAGE_KEY));
        return Number.isFinite(raw) ? raw : 1;
      }

      function apply(scale) {
        const clamped = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
        const rounded = Math.round(clamped * 100) / 100;
        root.style.setProperty('--zoom-scale', rounded.toFixed(2));
        if (levelEl) levelEl.textContent = `${Math.round(rounded * 100)}%`;
        try {
          localStorage.setItem(STORAGE_KEY, rounded);
        } catch (err) {
          // Ignore write failures (e.g. private browsing).
        }
        return rounded;
      }

      let current = apply(readStored());

      function zoomIn() { current = apply(current + STEP); }
      function zoomOut() { current = apply(current - STEP); }
      function zoomReset() { current = apply(1); }

      document.getElementById('zoom-in')?.addEventListener('click', zoomIn);
      document.getElementById('zoom-out')?.addEventListener('click', zoomOut);
      document.getElementById('zoom-reset')?.addEventListener('click', zoomReset);

      Reveal.addKeyBinding({ keyCode: 187, key: '+', description: 'Increase slide text size' }, zoomIn);
      Reveal.addKeyBinding({ keyCode: 189, key: '-', description: 'Decrease slide text size' }, zoomOut);
      Reveal.addKeyBinding({ keyCode: 48, key: '0', description: 'Reset slide text size' }, zoomReset);
    })();

    // --- Runtime canvas-size control -------------------------------------
    // Reveal scales its whole slide canvas to fit the display based on the
    // width/height given to Reveal.initialize(). A canvas designed smaller
    // than the actual display gets scaled UP more; changing these values at
    // runtime lets a presenter pick a canvas that fits a given projector or
    // screen rather than being stuck with the one nominal size in the code.
    // Persisted per browser via localStorage.
    (function initSizeControls() {
      const W_KEY = 'dv-slides-canvas-width';
      const H_KEY = 'dv-slides-canvas-height';
      const DEFAULT_W = 1920;
      const DEFAULT_H = 1080;
      const MIN_W = 320, MAX_W = 3840;
      const MIN_H = 240, MAX_H = 2160;

      const widthInput = document.getElementById('canvas-width');
      const heightInput = document.getElementById('canvas-height');

      function clampDim(value, fallback, min, max) {
        const n = parseInt(value, 10);
        if (!Number.isFinite(n)) return fallback;
        return Math.min(max, Math.max(min, n));
      }

      function applySize(rawWidth, rawHeight, persist) {
        const w = clampDim(rawWidth, DEFAULT_W, MIN_W, MAX_W);
        const h = clampDim(rawHeight, DEFAULT_H, MIN_H, MAX_H);
        if (widthInput) widthInput.value = w;
        if (heightInput) heightInput.value = h;
        Reveal.configure({ width: w, height: h });
        Reveal.layout();
        if (persist) {
          try {
            localStorage.setItem(W_KEY, w);
            localStorage.setItem(H_KEY, h);
          } catch (err) {
            // Ignore write failures (e.g. private browsing).
          }
        }
        return { w, h };
      }

      function applyFromInputs() {
        applySize(widthInput?.value, heightInput?.value, true);
      }

      function resetSize() {
        applySize(DEFAULT_W, DEFAULT_H, true);
      }

      document.getElementById('size-apply')?.addEventListener('click', applyFromInputs);
      document.getElementById('size-reset')?.addEventListener('click', resetSize);
      [widthInput, heightInput].forEach((el) => {
        el?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') applyFromInputs();
        });
      });

      // Re-apply a size saved from a previous visit, if different from the
      // page's hard-coded default.
      const storedW = localStorage.getItem(W_KEY);
      const storedH = localStorage.getItem(H_KEY);
      if (storedW || storedH) {
        applySize(storedW || DEFAULT_W, storedH || DEFAULT_H, false);
      }
    })();

    // --- Slide-scrolling toggle -------------------------------------------
    // markQuestionSlidesScrollable() tags ## Question / ## Review slides
    // with class="scrollable-slide" so long slides can be scrolled instead
    // of clipped. This one button overrides that presentation-wide: it adds
    // html.no-scroll-slides, which the CSS rule above uses (on selector
    // specificity, not just source order) to force every scrollable-slide
    // back to a normal fixed, non-scrolling slide. Persisted per browser.
    (function initScrollToggle() {
      const STORAGE_KEY = 'dv-slides-scroll-disabled';
      const root = document.documentElement;
      const btn = document.getElementById('scroll-toggle');

      function readStored() {
        return localStorage.getItem(STORAGE_KEY) === '1';
      }

      function apply(disabled) {
        root.classList.toggle('no-scroll-slides', disabled);
        if (btn) {
          btn.textContent = disabled ? 'Scroll: Off' : 'Scroll: On';
          btn.setAttribute('aria-pressed', String(disabled));
          btn.title = disabled
            ? 'Slide scrolling disabled for this presentation — click to re-enable on question/review slides'
            : 'Disable slide scrolling (all slides fixed-height)';
        }
        try {
          localStorage.setItem(STORAGE_KEY, disabled ? '1' : '0');
        } catch (err) {
          // Ignore write failures (e.g. private browsing).
        }
        return disabled;
      }

      let disabled = apply(readStored());

      btn?.addEventListener('click', () => {
        disabled = apply(!disabled);
      });
    })();

    // --- Image lightbox --------------------------------------------------
    // Click any image inside a slide to view it full-screen. Once open:
    // scroll, the +/- buttons, or +/-/0 keys zoom; dragging pans when
    // zoomed in. The pen tool draws scratch markup on top of the image —
    // it is never saved and is discarded as soon as the lightbox closes.
    // Images inside links (e.g. the YouTube thumbnail) are left alone so
    // their normal link behavior still works.
    (function initLightbox() {
      const overlay = document.getElementById('slide-lightbox');
      const stage = document.getElementById('lightbox-stage');
      const img = document.getElementById('lightbox-img');
      const canvas = document.getElementById('lightbox-canvas');
      const closeBtn = document.getElementById('lightbox-close');
      const penBtn = document.getElementById('lightbox-pen');
      const clearBtn = document.getElementById('lightbox-clear');
      const zoomInBtn = document.getElementById('lightbox-zoom-in');
      const zoomOutBtn = document.getElementById('lightbox-zoom-out');
      const zoomResetBtn = document.getElementById('lightbox-zoom-reset');
      const zoomLevelEl = document.getElementById('lightbox-zoom-level');
      const slidesEl = document.querySelector('.reveal .slides');
      if (!overlay || !stage || !img || !canvas || !slidesEl) return;

      const ctx = canvas.getContext('2d');
      const MIN_SCALE = 1;
      const MAX_SCALE = 5;
      const ZOOM_STEP = 0.25;
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let drawMode = false;
      let isPanning = false;
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      img.setAttribute('draggable', 'false');

      function applyTransform() {
        stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        stage.classList.toggle('zoomed', scale > 1);
        if (zoomLevelEl) zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
      }

      // Rough bound: caps how far the scaled image can be dragged based on
      // how much larger than the viewport it currently is. Approximate
      // rather than pixel-exact, which is plenty for a scratch viewer.
      function clampPan() {
        const maxPanX = Math.max(0, (stage.offsetWidth * scale - window.innerWidth) / 2);
        const maxPanY = Math.max(0, (stage.offsetHeight * scale - window.innerHeight) / 2);
        panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
        panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
      }

      function setScale(next) {
        scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
        if (scale === MIN_SCALE) { panX = 0; panY = 0; }
        clampPan();
        applyTransform();
      }

      function resetView() {
        scale = 1;
        panX = 0;
        panY = 0;
        applyTransform();
      }

      function resizeCanvasToImage() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(img.clientWidth * dpr));
        canvas.height = Math.max(1, Math.round(img.clientHeight * dpr));
      }

      function clearDrawing() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function setDrawMode(on) {
        drawMode = on;
        stage.classList.toggle('drawing', drawMode);
        if (penBtn) penBtn.setAttribute('aria-pressed', String(drawMode));
      }

      function open(src, alt) {
        img.onload = () => {
          resetView();
          resizeCanvasToImage();
          clearDrawing();
        };
        img.src = src;
        img.alt = alt || '';
        setDrawMode(false);
        overlay.classList.add('active');
      }

      function close() {
        overlay.classList.remove('active');
        img.src = '';
        clearDrawing();
        resetView();
        setDrawMode(false);
      }

      slidesEl.addEventListener('click', (e) => {
        const clicked = e.target.closest('img');
        if (!clicked || clicked.closest('a')) return;
        e.preventDefault();
        open(clicked.currentSrc || clicked.src, clicked.alt);
      });

      // Click the dark backdrop itself (not the toolbar/stage/close button)
      // to close.
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) close();
      });
      closeBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        close();
      });

      // --- Zoom -------------------------------------------------------------
      zoomInBtn?.addEventListener('click', () => setScale(scale + ZOOM_STEP));
      zoomOutBtn?.addEventListener('click', () => setScale(scale - ZOOM_STEP));
      zoomResetBtn?.addEventListener('click', resetView);

      overlay.addEventListener('wheel', (e) => {
        if (!overlay.classList.contains('active')) return;
        e.preventDefault();
        setScale(scale + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
      }, { passive: false });

      // --- Pen / markup -------------------------------------------------------
      penBtn?.addEventListener('click', () => setDrawMode(!drawMode));
      clearBtn?.addEventListener('click', clearDrawing);

      function canvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      // --- Drag: pans when zoomed in, draws a stroke in pen mode. Pointer
      // events (rather than mouse events) so touch/pen input works too, and
      // setPointerCapture keeps the drag going even if the pointer leaves
      // the stage mid-gesture.
      // Right mouse button (held) draws automatically, regardless of
      // whether the pen tool is toggled on; suppress the browser's own
      // context menu so a right-click-drag reads as a draw gesture.
      stage.addEventListener('contextmenu', (e) => e.preventDefault());

      stage.addEventListener('pointerdown', (e) => {
        stage.setPointerCapture(e.pointerId);
        const rightClick = e.button === 2;
        if (drawMode || rightClick) {
          isDrawing = true;
          stage.classList.add('drawing');
          const p = canvasPoint(e);
          ctx.strokeStyle = '#ff3b30';
          ctx.lineWidth = 3 * (window.devicePixelRatio || 1);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
        } else if (scale > 1) {
          isPanning = true;
          stage.classList.add('panning');
          lastX = e.clientX;
          lastY = e.clientY;
        }
        e.preventDefault();
      });

      stage.addEventListener('pointermove', (e) => {
        if (isDrawing) {
          const p = canvasPoint(e);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        } else if (isPanning) {
          panX += e.clientX - lastX;
          panY += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          clampPan();
          applyTransform();
        }
      });

      function endStroke(e) {
        isDrawing = false;
        if (isPanning) {
          isPanning = false;
          stage.classList.remove('panning');
        }
        // Only the pen-tool toggle should leave the drawing cursor on;
        // a right-click-drag stroke reverts it once the button is released.
        if (!drawMode) stage.classList.remove('drawing');
        try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* no-op */ }
      }
      stage.addEventListener('pointerup', endStroke);
      stage.addEventListener('pointercancel', endStroke);

      // Keep the drawing canvas aligned with the image if the window is
      // resized while open; markup is cleared, since it's throwaway anyway.
      window.addEventListener('resize', () => {
        if (!overlay.classList.contains('active')) return;
        resetView();
        resizeCanvasToImage();
        clearDrawing();
      });

      // Capture keydown ahead of Reveal's own handler so Escape/+/-/0
      // control the lightbox instead of Reveal's slide navigation or
      // text-zoom shortcuts while it's open.
      document.addEventListener('keydown', (e) => {
        if (!overlay.classList.contains('active')) return;
        if (e.key === 'Escape') close();
        else if (e.key === '+' || e.key === '=') setScale(scale + ZOOM_STEP);
        else if (e.key === '-' || e.key === '_') setScale(scale - ZOOM_STEP);
        else if (e.key === '0') resetView();
        e.stopPropagation();
      }, true);
    })();
  });
</script>
</body>
</html>
