<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" >
	<title>Excel.fun</title>

	<!-- Used to eliminate 300ms delay with iPad devices -->
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" >
	<link rel="shortcut icon" href="/static/favicon.ico">

	<!-- Speed up connections to third-party origins before they are requested -->
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="preconnect" href="https://accounts.google.com">

	<!-- force client to reload index. -->
	<meta http-equiv="cache-control" content="max-age=0" >
	<meta http-equiv="cache-control" content="no-cache" >
	<meta http-equiv="expires" content="0" >
	<meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" >
	<meta http-equiv="pragma" content="no-cache" >

	
	<!-- Bootstrap CSS: preload then swap to stylesheet so it does not block first paint -->
	<link
	rel="preload"
	as="style"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
	integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
	crossorigin="anonymous"
	onload="this.onload=null;this.rel='stylesheet'"
	/>
	<noscript>
	<link
		rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
		integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
		crossorigin="anonymous"
	/>
	</noscript>


	<!-- sql-wasm is only needed lazily (window.initSqlJs) when a SQL exercise runs -->
	<script src="/static/sql-wasm.js" defer></script>

	<!-- Google Identity Services (Sign in with Google) -->
	<script src="https://accounts.google.com/gsi/client" async defer></script>


	<link rel="stylesheet" href="/static/styles.css" />

</head>
<body>
	<div id='root'></div>
</body>
</html>
